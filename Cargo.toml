[package]
name = "swift-explorer"
version = "0.8.0"
edition = "2021"
description = "A file manager for Windows and Linux that looks and works like the Windows 11 File Explorer"
license = "MIT"
repository = "https://github.com/misutesu-desu/swift-explorer"
readme = "README.md"
rust-version = "1.82"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_extras = "0.31"
rayon = "1"
notify = "8"
trash = "5"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# README görüntülerini üretmek için, bkz. src/screenshot.rs
screenshot = []

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Globalization"] }

windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }
windows-core = "0.58"
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
mime_guess = "2"
freedesktop-icons = "0.4"
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
